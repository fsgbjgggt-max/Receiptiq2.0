name: Build Flutter APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Extract Flutter project
        run: |
          tar -xzf receiptiq-flutter.tar.gz
          cp -rn flutter-receiptiq/. .
          rm -rf flutter-receiptiq

      - name: Fix Dart import errors
        run: |
          sed -i "s|import '../widgets/transaction_tile.dart';|import '../widgets/transaction_tile.dart';\nimport '../widgets/spending_ring.dart';|" lib/screens/transaction_detail_screen.dart
          sed -i "s|import '../widgets/transaction_tile.dart';|import '../widgets/transaction_tile.dart';\nimport '../widgets/spending_ring.dart';|" lib/screens/transactions_screen.dart
          sed -i "s|import '../providers/app_provider.dart';|import '../providers/app_provider.dart';\nimport '../widgets/transaction_tile.dart';\nimport '../widgets/spending_ring.dart';|" lib/screens/analytics_screen.dart
          sed -i "s|import '../providers/app_provider.dart';|import '../providers/app_provider.dart';\nimport '../widgets/transaction_tile.dart';|" lib/screens/budgets_screen.dart

      - name: Fix theme.dart constructor names
        run: |
          sed -i 's/CardThemeData(/CardTheme(/g' lib/theme.dart
          sed -i 's/DialogThemeData(/DialogTheme(/g' lib/theme.dart

      - name: Rebuild Android folder
        run: |
          rm -rf android
          flutter create --platforms=android --org com.receiptiq --project-name receiptiq .

      - name: Fix Gradle version
        run: |
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-all.zip
          EOF

      - name: Fix app build.gradle
        run: |
          cat > android/app/build.gradle << 'EOF'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace "com.receiptiq.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.receiptiq.app"
                  minSdk = 21
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.debug
                      minifyEnabled = false
                      shrinkResources = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = "1.8"
              }
          }

          flutter {
              source = "../.."
          }
          EOF

      - name: Fix settings.gradle to force Kotlin 1.9.22
        run: |
          cat > android/settings.gradle << 'EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.3.0" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }

          include ":app"
          EOF

      - name: Restore AndroidManifest
        run: |
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.USE_BIOMETRIC"/>
              <uses-permission android:name="android.permission.USE_FINGERPRINT"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-feature android:name="android.hardware.camera" android:required="false"/>
              <application
                  android:name="${applicationName}"
                  android:label="ReceiptIQ"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme"/>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2"/>
              </application>
          </manifest>
          EOF

      - name: Restore MainActivity
        run: |
          mkdir -p android/app/src/main/kotlin/com/receiptiq/app
          cat > android/app/src/main/kotlin/com/receiptiq/app/MainActivity.kt << 'EOF'
          package com.receiptiq.app

          import io.flutter.embedding.android.FlutterFragmentActivity

          class MainActivity : FlutterFragmentActivity()
          EOF

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReceiptIQ-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
